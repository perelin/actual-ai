x-actual-ai-base: &actual-ai-base
  build: .
  restart: "no"
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Two explicit services so the mode is part of the command, not a hidden flag in .env.
# The default service name is intentionally NOT "actual-ai" — you must type the mode.
services:
  actual-ai-dry:
    <<: *actual-ai-base
    container_name: actual-ai-dry
    environment:
      #FEATURES: '["classifyOnStartup","freeWebSearch","dryRun"]'
      FEATURES: '["classifyOnStartup", "dryRun", "fewShotPayeeHistory"]'

  # Same as actual-ai-dry, but with claude-haiku-4-5 instead of the default
  # ANTHROPIC_MODEL from .env. Used for A/B-comparing Haiku vs Sonnet
  # categorization quality on the same uncategorized tx set.
  actual-ai-dry-haiku:
    <<: *actual-ai-base
    container_name: actual-ai-dry-haiku
    environment:
      FEATURES: '["classifyOnStartup", "dryRun", "fewShotPayeeHistory"]'
      ANTHROPIC_MODEL: claude-haiku-4-5

  actual-ai-live:
    <<: *actual-ai-base
    container_name: actual-ai-live
    environment:
      #FEATURES: '["classifyOnStartup","freeWebSearch"]'
      FEATURES: '["classifyOnStartup", "fewShotPayeeHistory"]'

  # Live + rerunMissedTransactions: re-evaluates every #actual-ai-miss tx so
  # freshly written resolver/enricher notes get harvested (P2L-209 Monatslauf).
  # Own service instead of a live default because each run pays LLM calls for
  # ALL open misses — only worth it right after new notes were written.
  actual-ai-live-rerun:
    <<: *actual-ai-base
    container_name: actual-ai-live-rerun
    environment:
      FEATURES: '["classifyOnStartup", "fewShotPayeeHistory", "rerunMissedTransactions"]'
