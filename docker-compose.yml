x-prompt-template: &prompt-template |
  I want to categorize the given bank transaction.

  Transaction details:
  * Amount: {{amount}}
  * Type: {{type}}
  {{#if description}}
  * Description: {{description}}
  {{/if}}
  {{#if payee}}
  * Payee: {{payee}}
  {{^}}
  * Payee: {{importedPayee}}
  {{/if}}
  {{#if date}}
  * Date: {{date}}
  {{/if}}

  Existing categories by group:
  {{#each categoryGroups}}
  GROUP: {{name}} (ID: "{{id}}")
  {{#each categories}}
  * {{name}} (ID: "{{id}}"){{#if description}}
    {{description}}{{/if}}{{#if examples.length}}
    Beispiele: {{#each examples}}{{this}}{{#unless @last}}, {{/unless}}{{/each}}{{/if}}{{#if disambiguation}}
    Hinweis: {{disambiguation}}{{/if}}
  {{/each}}
  {{/each}}

  {{#if rules.length}}
  Existing Rules:
  {{#each rules}}
  {{incIndex @index}}. {{ruleName}} → {{categoryName}}
     Conditions: {{#each conditions}}{{field}} {{op}} {{value}}{{#unless @last}}, {{/unless}}{{/each}}
  {{/each}}
  {{/if}}
  {{#if payeeHistory}}
  {{#if (eq payeeHistory.matchType "aggregator-skip")}}
  Note: this payee is a known payment aggregator (PayPal/Klarna/Sumup/Amazon Payments/Apple-Bill style). The real merchant is hidden behind the payee name. If the description, notes, or amount do not clearly identify the actual merchant or category, respond with {"type": "skip"} — do not guess.
  {{else}}
  Past classifications for this payee (normalized: "{{payeeHistory.normalizedKey}}", match: {{payeeHistory.matchType}}):
  {{payeeHistory.histogramLine}}

  Most recent examples:
  {{#each payeeHistory.entries}}
  * {{date}} | amount {{amount}} | "{{importedPayee}}" → {{categoryName}}
  {{/each}}

  Use this history as a strong prior. Only deviate when the current transaction's amount, description, or notes clearly indicate a different category.
  {{/if}}
  {{/if}}

  CATEGORIZATION RULES (IMPORTANT, in order):

  1. Prefer abstention over a wrong guess. Respond with {"type": "skip"} when no existing category clearly fits. Skipped transactions stay uncategorized for manual review.

  2. Use the per-category description, examples ("Beispiele:") and disambiguation ("Hinweis:") above as your primary guide. A weak or speculative association is NOT enough — skip instead.

  3. Self-transfers (a payee that is the user's own name with an IBAN in parentheses) are typically savings transfers — see the description of the "Savings" category. Classify them; do NOT skip them just because the payee is a personal name.

  4. Do not suggest new categories unless the transaction clearly belongs to a domain that no existing category covers.

  RESPONSE FORMAT: respond with ONLY a valid JSON object in one of these shapes:

  {"type": "existing", "categoryId": "<uuid>"}
  {"type": "rule", "categoryId": "<uuid>", "ruleName": "string"}
  {"type": "new", "newCategory": {"name": "string", "groupName": "string", "groupIsNew": boolean}}
  {"type": "skip"}

  DO NOT output any text before or after the JSON. Your entire response must be a valid, parsable JSON object.

  {{#if hasWebSearchTool}}
  You can use the web search tool to find more information about the transaction when the merchant is unfamiliar.
  {{/if}}

x-actual-ai-base: &actual-ai-base
  build: .
  restart: "no"
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Two explicit services so the mode is part of the command, not a hidden flag in .env.
# The default service name is intentionally NOT "actual-ai" — you must type the mode.
services:
  actual-ai-dry:
    <<: *actual-ai-base
    container_name: actual-ai-dry
    environment:
      #FEATURES: '["classifyOnStartup","freeWebSearch","dryRun"]'
      FEATURES: '["classifyOnStartup", "dryRun", "fewShotPayeeHistory"]'
      PROMPT_TEMPLATE: *prompt-template

  actual-ai-live:
    <<: *actual-ai-base
    container_name: actual-ai-live
    environment:
      #FEATURES: '["classifyOnStartup","freeWebSearch"]'
      FEATURES: '["classifyOnStartup", "fewShotPayeeHistory"]'
      PROMPT_TEMPLATE: *prompt-template

  # Read-only diagnostic: dumps imported_payee analytics from the live Actual
  # budget. Does NOT call any LLM and does NOT write to Actual. Intended for
  # tuning the per-payee fuzzy-matching threshold and inspecting bank-string
  # normalization candidates.
  actual-ai-recon:
    <<: *actual-ai-base
    container_name: actual-ai-recon
    command: ["npm", "run", "recon:payees"]

  # Read-only diagnostic: dumps category list + per-category usage counts and
  # top payees from the live Actual budget. Does NOT call any LLM and does NOT
  # write to Actual. Intended for designing per-category prompt augmentations
  # (descriptions / examples).
  actual-ai-recon-categories:
    <<: *actual-ai-base
    container_name: actual-ai-recon-categories
    command: ["npm", "run", "recon:categories"]
